<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b11" />
  <meta name="description" content="Catálogo de juegos de Software Society. Cartas, corridas, campanas, mazmorras y chanclas." />
  <meta property="og:title" content="Sala de juegos — Software Society" />
  <meta property="og:description" content="Juegos de Software Society." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="covers/corona-de-ceniza.jpg" />
  <title>Sala de juegos — Software Society</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="brand/software-society.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&amp;family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-head">
    <a class="brand" href="#catalogo">
      <img src="brand/software-society.png" width="56" height="56" alt="Software Society" />
      <span>
        <small>Software Society</small>
        <strong>Sala de juegos</strong>
      </span>
    </a>
    <nav class="head-nav">
      <a href="https://github.com/DonMAriando" rel="noopener noreferrer">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Software Society</p>
      <h1>Sala de juegos</h1>
      <p class="lede">Juegos para el navegador.</p>
      <p class="hero-count" id="heroCount"></p>
    </section>

    <section id="catalogo" class="catalog" aria-labelledby="catalogTitle">
      <div class="catalog-bar">
        <h2 id="catalogTitle">Juegos</h2>
        <div class="filters" id="filters" role="tablist" aria-label="Filtrar por género"></div>
        <label class="search">
          <span class="sr-only">Buscar juegos</span>
          <input id="search" type="search" placeholder="Buscar…" autocomplete="off" />
        </label>
      </div>
      <div id="featured" class="featured" hidden></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>No hay juegos con ese filtro.</p>
    </section>
  </main>

  <footer class="site-foot">
    <p>Software Society</p>
  </footer>

  <noscript>
    <p class="noscript">Hace falta JavaScript para ver el catálogo.</p>
  </noscript>
  <script src="games.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
